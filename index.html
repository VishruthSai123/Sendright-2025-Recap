
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SendRight 2025 Impact Recap</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --green-glow: 0 0 20px rgba(34, 197, 94, 0.3);
        }
        html {
            scroll-snap-type: y mandatory;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: #ffffff;
            margin: 0;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #000;
        }
        ::-webkit-scrollbar-thumb {
            background: #22c55e;
            border-radius: 4px;
        }
        .perspective-1000 { perspective: 1000px; }
        .perspective-2000 { perspective: 2000px; }
        .bg-grid {
            background-image: linear-gradient(to right, #22c55e10 1px, transparent 1px),
                              linear-gradient(to bottom, #22c55e10 1px, transparent 1px);
            background-size: 50px 50px;
        }
        .text-stroke {
            -webkit-text-stroke: 1px rgba(255,255,255,0.1);
            color: transparent;
        }
        section {
            will-change: transform, opacity;
            scroll-snap-align: start;
            scroll-snap-stop: always;
        }
    </style>
